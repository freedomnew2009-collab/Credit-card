<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="จดบัตร">
<title>จดบัตรเครดิต — บันทึกค่าใช้จ่ายบัตรเครดิต</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@200;300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="supabase.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --app-bg: #F4F1EA;
    --bg: #FBF9F4;
    --raised: rgba(255,255,255,.86);
    --sunken: rgba(23,20,14,.05);
    --t1: #17140E;
    --t1b: #1E1A12;
    --t2: rgba(23,20,14,.66);
    --t3: rgba(23,20,14,.52);
    --hair: rgba(23,20,14,.09);
    --hairsoft: rgba(23,20,14,.05);
    --gold: #8A6A28;
    --gold-deep: #6E5219;
    --gold-tint: rgba(150,116,45,.12);
    --gold-tint-strong: rgba(150,116,45,.16);
    --gold-bd: rgba(150,116,45,.42);
    --success: #2E7D55;
    --success-a: rgba(38,110,74,.98);
    --warn: #A9640F;
    --scrim: rgba(60,50,25,.34);
    --tabbar-bg: rgba(255,255,255,.9);
    --sheet-bg: linear-gradient(180deg,#FFFFFF,#F6F2E8);
    --key-active: rgba(150,116,45,.24);
    --card-shadow: 0 18px 40px -18px rgba(60,50,25,.26);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --app-bg: #08080A;
      --bg: #0A0A0D;
      --raised: rgba(255,255,255,.055);
      --sunken: rgba(255,255,255,.06);
      --t1: #F5F2EC;
      --t1b: #F0EDE7;
      --t2: rgba(245,242,236,.66);
      --t3: rgba(245,242,236,.5);
      --hair: rgba(255,255,255,.08);
      --hairsoft: rgba(255,255,255,.05);
      --gold: #D8C08C;
      --gold-deep: #E8D8AC;
      --gold-tint: rgba(216,192,140,.12);
      --gold-tint-strong: rgba(216,192,140,.16);
      --gold-bd: rgba(216,192,140,.4);
      --success: #7FCFA4;
      --success-a: rgba(127,207,164,.92);
      --warn: #E0A55F;
      --scrim: rgba(0,0,0,.55);
      --tabbar-bg: rgba(24,24,28,.9);
      --sheet-bg: linear-gradient(180deg,#1A1A1E,#121215);
      --key-active: rgba(216,192,140,.24);
      --card-shadow: 0 18px 40px -18px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Anuphan', system-ui, sans-serif;
    background: var(--app-bg);
    color: var(--t1);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  *::-webkit-scrollbar { width: 0; height: 0; }
  input, textarea, select, button { font-family: 'Anuphan', sans-serif; }
  input::placeholder, textarea::placeholder { color: var(--t2); font-weight: 500; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes sheetUp { from { opacity:0; transform:translateY(100%); } to { opacity:1; transform:none; } }
  @keyframes popIn { 0% { opacity:0; transform:scale(.86); } 60% { transform:scale(1.04); } 100% { opacity:1; transform:scale(1); } }
  @keyframes shimmer { 0% { transform:translateX(-140%) rotate(8deg); } 55%,100% { transform:translateX(240%) rotate(8deg); } }
  @keyframes auraDrift { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(6%,-5%) scale(1.12); } }
  @keyframes barGrow { from { transform:scaleY(.02); } to { transform:scaleY(1); } }
  @keyframes checkDraw { to { stroke-dashoffset:0; } }
  @keyframes glowPulse { 0%,100% { opacity:.35; } 50% { opacity:.75; } }
  @keyframes scanSweep { 0% { top:26px; } 50% { top:calc(100% - 28px); } 100% { top:26px; } }
  @keyframes ringSpin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .shimmer-el, .aura, .scanline { animation: none !important; display: none; }
    * { animation-duration: .01ms !important; }
  }

  .phone {
    position: relative; max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
  }
  .phone::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(90% 46% at 50% 0%, rgba(150,116,45,.09) 0%, rgba(150,116,45,0) 60%),
                radial-gradient(70% 40% at 100% 100%, rgba(90,110,200,.07) 0%, rgba(0,0,0,0) 70%);
  }
  .content { position: relative; z-index: 10; flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }

  .eyebrow { font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--t2); font-weight:700; white-space:nowrap; }
  .screen-title { white-space:nowrap; font-size:20.5px; color:var(--t1); font-weight:600; }
  .raised { background: var(--raised); border: 1px solid var(--hair); }
  .tnum { font-variant-numeric: tabular-nums; }
  .u-fadeup { animation: fadeUp .55s cubic-bezier(.2,.8,.2,1) both; }
  .u-fadein { animation: fadeIn .45s ease both; }
  .ellip { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .cta {
    height: 60px; border-radius: 18px; border: none; width: 100%;
    background: linear-gradient(135deg,#E7D3A4,#C8A96A 55%,#A9884A);
    display: flex; align-items: center; justify-content: center; gap: 9px;
    color: #1A1508; font-size: 18.5px; font-weight: 700; letter-spacing: .4px;
    cursor: pointer; box-shadow: 0 14px 30px -12px rgba(150,116,45,.7); transition: .25s;
  }
  .cta:active { transform: scale(.98); }
  .cta:disabled { opacity: .5; }

  .chip {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border-radius: 99px; cursor: pointer; transition: .3s;
    background: transparent; border: 1px solid var(--hairsoft); color: var(--t3);
    font-size: 15px; white-space: nowrap;
  }
  .chip.sel { background: var(--gold-tint-strong); border-color: var(--gold-bd); color: var(--gold-deep); }

  .fieldrow {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 15px; background: var(--raised); border: 1px solid var(--hair); transition: .28s;
  }
  .fieldrow > label { flex: 0 0 88px; white-space: nowrap; font-size: 14.5px; font-weight: 600; color: var(--t2); }
  .fieldrow input, .fieldrow select {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--t1b); font-size: 17.5px; font-weight: 600;
  }
  .fieldrow select option { color: #1E1A12; background: #fff; }

  .txr {
    display: flex; align-items: center; gap: 13px; padding: 15px 4px;
    border-bottom: 1px solid var(--hairsoft); transition: .2s; cursor: pointer;
  }
  .txr:hover { background: rgba(23,20,14,.035); }
  .txr .ic {
    width: 40px; height: 40px; flex: 0 0 40px; border-radius: 13px;
    background: var(--sunken); border: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: center; font-size: 20.5px;
  }
  .txr .nm { font-size: 17.5px; color: var(--t1b); }
  .txr .mt { margin-top: 2px; font-size: 14px; color: var(--t2); }
  .txr .amt { font-size: 18px; font-weight: 500; color: var(--t1); }
  .txr .st { margin-top: 2px; font-size: 12.5px; }

  .key {
    height: 64px; border-radius: 16px; background: var(--sunken); border: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 500; color: var(--t1b);
    cursor: pointer; user-select: none; transition: .15s;
  }
  .key:active { transform: scale(.94); background: var(--key-active); border-color: var(--gold-bd); }

  .scrim-host {
    position: fixed; inset: 0; z-index: 55; background: var(--scrim);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; align-items: flex-end; justify-content: center;
    animation: fadeIn .25s ease both;
  }
  .scrim-host.open { display: flex; }
  .sheet {
    width: 100%; max-width: 430px; max-height: 88vh; overflow-y: auto;
    border-radius: 30px 30px 0 0; background: var(--sheet-bg);
    border-top: 1px solid var(--hair); padding: 14px 20px calc(30px + env(safe-area-inset-bottom));
    animation: sheetUp .42s cubic-bezier(.2,.85,.25,1) both;
    box-shadow: 0 -24px 60px -20px rgba(0,0,0,.5);
  }
  .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--hair); margin: 0 auto 16px; }

  .tabwrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .tabbar {
    pointer-events: auto; max-width: 398px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; border-radius: 26px; background: var(--tabbar-bg);
    border: 1px solid var(--hair);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 12px 30px -14px rgba(60,50,25,.4);
  }
  .tabbar .ti {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; padding: 4px 0; transition: .3s; min-height: 44px; justify-content: center;
    border: none; background: transparent;
  }
  .tabbar .ti .tic { font-size: 20.5px; line-height: 1; transition: .3s; }
  .tabbar .ti .tlb { font-size: 12.5px; letter-spacing: .3px; }
  .tabgrad {
    position: fixed; left: 0; right: 0; bottom: 0; height: 110px; z-index: 30; pointer-events: none;
    background: linear-gradient(180deg, rgba(251,249,244,0) 0%, var(--bg) 78%);
  }

  .cal-cell {
    height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-variant-numeric: tabular-nums; transition: .22s; border: 1px solid transparent;
    background: var(--sunken); color: var(--t1b); cursor: pointer; font-weight: 500;
  }
  .cal-cell.blank { background: transparent; cursor: default; }
  .cal-cell.future { color: var(--t3); cursor: default; background: var(--sunken); opacity: .55; }
  .cal-cell.today { border-color: rgba(150,116,45,.32); font-weight: 700; }
  .cal-cell.selc {
    background: linear-gradient(135deg,#E7D3A4,#C8A96A 55%,#A9884A); color: #1A1508;
    font-weight: 700; box-shadow: 0 10px 22px -10px rgba(150,116,45,.85);
  }

  .pillbtn {
    white-space: nowrap; padding: 7px 13px; border-radius: 99px; font-size: 14px;
    cursor: pointer; transition: .25s; border: 1px solid var(--hair);
    background: var(--sunken); color: var(--t2);
  }
  .pillbtn.gold { background: rgba(150,116,45,.14); border-color: rgba(150,116,45,.32); color: var(--gold-deep); }

  .aura { position:absolute; border-radius:50%; pointer-events:none; animation:auraDrift 14s ease-in-out infinite; }
  .shimmer-el {
    position:absolute; top:0; bottom:0; width:70px;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22),rgba(255,255,255,0));
    animation:shimmer 6s ease-in-out infinite;
  }
  .scanline {
    position:absolute; left:26px; right:26px; height:2px; top:26px;
    background:linear-gradient(90deg,rgba(150,116,45,0),#8A6A28,rgba(150,116,45,0));
    box-shadow:0 0 22px 4px rgba(150,116,45,.55);
    animation:scanSweep 2.2s cubic-bezier(.6,0,.4,1) infinite;
  }

  .loading { text-align:center; color:var(--t2); padding:80px 0; font-size:15px; }
  .spin {
    width:34px; height:34px; border-radius:50%; margin:0 auto 14px;
    border:2px solid var(--hair); border-top-color:var(--gold);
    animation:ringSpin .9s linear infinite;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="content" id="app">
    <div class="loading"><div class="spin"></div>กำลังโหลด…</div>
  </div>
</div>
<div id="tabHost"></div>
<div class="scrim-host" id="sheetHost" onclick="if(event.target===this)closeSheet()"></div>
<div id="overlayHost"></div>

<script>
"use strict";
const CFG = window.APP_CONFIG || {};
let sb = null, session = null;
let cards = [], txs = [], plans = [];
const THM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THM_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ICON = { food:'🍽', shopping:'🛍', clothes:'👕', shoes:'👟', bag:'👜', shopee:'🛒', fuel:'⛽', other:'📦' };
const CATS = [
  { k:'food', label:'อาหาร' }, { k:'shopping', label:'ช้อปปิ้ง' }, { k:'clothes', label:'เสื้อผ้า' },
  { k:'shoes', label:'รองเท้า' }, { k:'bag', label:'กระเป๋า' }, { k:'shopee', label:'Shopee' },
  { k:'fuel', label:'น้ำมัน' }, { k:'other', label:'อื่นๆ' }
];
const CATCOLOR = { food:'#C8A96A', clothes:'#7F9FCF', shopee:'#CF7F8C', shoes:'#2E7D55', bag:'#B08CD8', fuel:'#A9640F', other:'#6A6A76', shopping:'#8A6A28' };
/* ลายบัตรตามสีแบรนด์จริงของธนาคารไทย (สีอ้างอิงจากแบรนด์จริง) */
const SKINS = [
  { n:'บรอนซ์ทอง', g:'linear-gradient(140deg,#2B2418 0%,#4A3C22 34%,#171208 68%,#3A2F1B 100%)' },
  { n:'กรมท่า', g:'linear-gradient(140deg,#101A2E 0%,#1E2E4E 38%,#0A101C 72%,#16233C 100%)' },
  { n:'กราไฟต์', g:'linear-gradient(140deg,#2A2C30 0%,#4C5057 36%,#191B1E 70%,#3A3E44 100%)' },
  { n:'พลัมแดง', g:'linear-gradient(140deg,#2A121A 0%,#4E2030 36%,#180A10 70%,#3C1826 100%)' },
  { n:'เขียว กสิกร', g:'linear-gradient(140deg,#01331D 0%,#04A94E 44%,#013B21 76%,#0A8A40 100%)' },
  { n:'ม่วง ไทยพาณิชย์', g:'linear-gradient(140deg,#241040 0%,#5B3A8E 42%,#180A2E 74%,#42277A 100%)' },
  { n:'เหลือง กรุงศรี', g:'linear-gradient(140deg,#3A2E00 0%,#E6B800 45%,#2E2400 76%,#A38200 100%)' },
  { n:'ฟ้า กรุงไทย', g:'linear-gradient(140deg,#00293D 0%,#00A6E6 45%,#00202F 76%,#0084B8 100%)' },
  { n:'น้ำเงิน บัวหลวง', g:'linear-gradient(140deg,#071433 0%,#1E4598 44%,#050E24 76%,#17356F 100%)' },
  { n:'น้ำเงิน ttb', g:'linear-gradient(140deg,#001244 0%,#0050F0 48%,#000D30 78%,#0038A8 100%)' },
  { n:'ชมพู ออมสิน', g:'linear-gradient(140deg,#400024 0%,#EC008C 46%,#330020 78%,#B00068 100%)' },
  { n:'น้ำเงิน UOB', g:'linear-gradient(140deg,#000A20 0%,#12398A 46%,#000818 78%,#0B2A66 100%)' },
  { n:'ม่วงแดง AEON', g:'linear-gradient(140deg,#26001A 0%,#B6007A 46%,#1D0016 78%,#8A005C 100%)' },
  { n:'ดำพรีเมียม', g:'linear-gradient(160deg,#26262A 0%,#0B0B0D 55%,#1C1C20 100%)' },
];
const PLAN_ICONS = ['💻','📱','👜','✈️','🛋️','📺','🎮','💍','⌚','📦'];

const S = {
  screen: 'home', activeCard: null, addMode: 'pad',
  pad: '', padCat: 'food', padCard: null, txName: '', txPlace: '', dayOffset: 0,
  calY: 0, calM: 0, calTarget: 'add',
  query: '', filter: 'all', sortAsc: false,
  editTx: null, paySel: new Set(), scanImg: null,
};

const $ = (id) => document.getElementById(id);
const app = $('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (n, dec) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const catLabel = (k) => (CATS.find(c => c.k === k) || { label:'อื่นๆ' }).label;
const catIcon = (k) => ICON[k] || '📦';
const skinOf = (c) => SKINS[(c && c.skin || 0) % SKINS.length].g;
/* บรรทัดกลางบัตร: มีเลข 4 ตัว → •••• 8842 / ไม่มี → ชื่อที่ตั้งเอง */
const cardMid = (c) => c.last4
  ? `<span class="tnum" style="letter-spacing:2.6px;">•••• ${esc(c.last4)}</span>`
  : `<span class="ellip" style="letter-spacing:.6px; font-weight:500;">${esc(c.name)}</span>`;
const cardById = (id) => cards.find(c => c.id === id);

function thShort(dstr) { const d = new Date(dstr + 'T00:00:00'); return d.getDate() + ' ' + THM[d.getMonth()]; }
function thShortY(d) { return d.getDate() + ' ' + THM[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(-2); }
function dateFromOffset(o) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - o); return d; }
function greet() { const h = new Date().getHours(); return h < 12 ? 'สวัสดีตอนเช้า' : h < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น'; }
function userName() { return session ? session.user.email.split('@')[0] : ''; }

/* รอบบิล: ปิดรอบวันที่ statement_day */
function cycleOf(card) {
  const sd = card.statement_day;
  const t = new Date(), m = t.getMonth();
  if (!sd) return { cycleRange: 'เดือน ' + THM[m] };
  const sDay = sd >= 28 ? 1 : sd + 1, sM = sd >= 28 ? m : (m + 11) % 12;
  return { cycleRange: sDay + ' ' + THM[sM] + ' – ' + sd + ' ' + THM[m] };
}
const unpaidOf = (id) => txs.filter(t => t.card_id === id && !t.paid).reduce((a,t) => a + Number(t.amount), 0);
function monthTotal(offset) {
  const t = new Date(); const y = t.getFullYear(), m = t.getMonth() + (offset || 0);
  const s = ymd(new Date(y, m, 1)), e = ymd(new Date(y, m + 1, 0));
  return txs.filter(x => x.tx_date >= s && x.tx_date <= e).reduce((a,x) => a + Number(x.amount), 0);
}

/* ---------- data ---------- */
async function loadData() {
  const [c, t, p] = await Promise.all([
    sb.from('cards').select('*').order('created_at'),
    sb.from('transactions').select('*').order('tx_date', { ascending:false }).order('created_at', { ascending:false }),
    sb.from('plans').select('*').order('created_at'),
  ]);
  if (c.error || t.error) { alert('โหลดข้อมูลไม่สำเร็จ: ' + (c.error || t.error).message); return; }
  cards = c.data; txs = t.data; plans = p.error ? [] : p.data;
  if (!S.activeCard || !cardById(S.activeCard)) S.activeCard = cards[0] ? cards[0].id : null;
  if (!S.padCard || !cardById(S.padCard)) S.padCard = cards[0] ? cards[0].id : null;
}

/* ---------- shells ---------- */
function render() {
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) { $('tabHost').innerHTML = ''; return renderSetup(); }
  if (!session) { $('tabHost').innerHTML = ''; return renderAuth(); }
  renderTabs();
  const R = { home: renderHome, list: renderList, add: renderAdd, stats: renderStats, cards: renderCards, plans: renderPlans };
  (R[S.screen] || renderHome)();
}
window.go = (screen) => { S.screen = screen; render(); const c = document.querySelector('.content'); if (c) c.scrollTop = 0; };

function renderTabs() {
  const nav = [
    { k:'home', icon:'◈', label:'หน้าแรก' }, { k:'list', icon:'☰', label:'รายการ' },
    { k:'add', icon:'＋', label:'เพิ่ม' }, { k:'stats', icon:'◔', label:'วิเคราะห์' }, { k:'cards', icon:'▤', label:'บัตร' }
  ];
  $('tabHost').innerHTML = `<div class="tabgrad"></div><div class="tabwrap"><div class="tabbar">
    ${nav.map(n => { const on = S.screen === n.k; return `
      <button class="ti" onclick="go('${n.k}')">

/* OCR อ่านสลิปด้วย Tesseract (ไฟล์หลักอยู่ใน repo, ข้อมูลภาษาโหลดครั้งแรกจากอินเทอร์เน็ต) */
function setScanStatus(msg) {
  const el = $('scanStatus');
  if (el) el.innerHTML = `<span style="width:6px; height:6px; border-radius:50%; background:var(--gold); display:block; animation:glowPulse 1.2s infinite;"></span>${msg}`;
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลดสคริปต์ไม่สำเร็จ'));
    document.head.appendChild(s);
  });
}
function parseSlip(text) {
  let amount = null;
  const kw = text.match(/(?:จำนวนเงิน|จำนวน|ยอดรวม|ยอดสุทธิ|รวมทั้งสิ้น|รวม|Amount|Total|THB)[^0-9]{0,12}(\d{1,3}(?:,\d{3})*(?:\.\d{2})?)/i);
  if (kw) amount = parseFloat(kw[1].replace(/,/g, ''));
  if (!amount) {
    const all = [...text.matchAll(/(\d{1,3}(?:,\d{3})*\.\d{2})/g)].map(m => parseFloat(m[1].replace(/,/g, '')));
    if (all.length) amount = Math.max(...all);
  }
  let merchant = '';
  const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean);
  for (const L of lines) {
    if (/[A-Za-zก-๙]{3}/.test(L) && L.length >= 4 && L.length <= 60 &&
        !/(ธนาคาร|โอนเงิน|สแกน|สำเร็จ|เรียบร้อย|slip|verify|ref|เลขที่|รหัส|อ้างอิง|จำนวน|ยอด|บาท|baht|thb|วันที่|เวลา|k ?plus|krungthai|next|make|พร้อมเพย์|promptpay|qr|ค่าธรรมเนียม|fee|จาก|ไปยัง|บัญชี|x{2,}|\*{2,})/i.test(L)) {
      merchant = L.replace(/[|_=+~^]/g, '').trim(); break;
    }
  }
  return { amount, merchant };
}
let ocrBusy = false;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function runOcr(dataUrl) {
  if (ocrBusy) return;
  ocrBusy = true;
  let worker = null;
  try {
    setScanStatus('กำลังเตรียมตัวอ่านสลิป…');
    if (!window.Tesseract) await loadScript('vendor/tesseract.min.js');
    const base = new URL('vendor/', location.href).href;
    setScanStatus('กำลังอ่านสลิป… 0%');
    worker = await withTimeout(Tesseract.createWorker(['tha', 'eng'], 1, {
      workerPath: base + 'worker.min.js',
      corePath: base,
      langPath: base + 'lang',
      logger: (m) => { if (m.status === 'recognizing text') setScanStatus('กำลังอ่านสลิป… ' + Math.round(m.progress * 100) + '%'); },
    }), 90000);
    const { data } = await withTimeout(worker.recognize(dataUrl), 90000);
    await worker.terminate();
    worker = null;
    const p = parseSlip(data.text || '');
    if ($('scAmount') && p.amount) $('scAmount').value = p.amount;
    if ($('scName') && p.merchant && !$('scName').value) $('scName').value = p.merchant;
    if (p.amount) setScanStatus(`อ่านสลิปสำเร็จ · ความมั่นใจ ${Math.round(data.confidence || 0)}% — ตรวจสอบแล้วกดบันทึก`);
    else setScanStatus('อ่านรูปได้แต่ไม่พบยอดเงิน — กรอกยอดเองด้านล่างได้เลย');
  } catch (e) {
    if (worker) try { worker.terminate(); } catch (_) {}
    setScanStatus('อ่านอัตโนมัติไม่สำเร็จ (ครั้งแรกต้องต่ออินเทอร์เน็ตเพื่อโหลดข้อมูลภาษา) — กรอกข้อมูลเองด้านล่างได้เลย');
  }
  ocrBusy = false;
}

function parseSms() {
  const txt = $('smsText').value;
  smsData = null;
  const host = $('smsParsed');

  const last4 = txt.match(/(?:x{2,4}[- ]?|\*{2,4}[- ]?|หมายเลข\s*(?:x+|\*+)?[- ]?)(\d{4})/i);
  const merch = txt.match(/ที่\s+([A-Za-z0-9ก-๙&.'\- ]+?)(?=\s+วันที่|\s+เมื่อ|\s+จำนวน|\s*$)/);
  const dm = txt.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);

  if (dm) {

  smsData = { amount, merchant: merch ? merch[1].trim() : '', cardId: card ? card.id : (S.padCard || (cards[0] && cards[0].id)), dateStr };

/* ---------- STATS ---------- */
function renderStats() {
  const totals = {};
  txs.forEach(t => { totals[t.category] = (totals[t.category] || 0) + Number(t.amount); });
  const catTotal = Object.values(totals).reduce((a,b) => a + b, 0);
  const C = 2 * Math.PI * 55;
  let acc = 0;
  const donut = Object.keys(totals).sort((a,b) => totals[b] - totals[a]).map((k, i) => {
    const frac = totals[k] / catTotal, len = Math.max(2, C * frac - 3);
    const d = { label: catLabel(k), color: CATCOLOR[k] || '#6A6A76', pct: Math.round(frac * 100),
      dash: len + ' ' + (C - len), offset: -acc, delay: (i * 0.09).toFixed(2) };
    acc += C * frac; return d;
  });

  const months = [];
  const t = new Date();
  for (let i = 5; i >= 0; i--) {
    const m = new Date(t.getFullYear(), t.getMonth() - i, 1);
    months.push({ m: THM[m.getMonth()], v: monthTotal(-i) / 1000 });
  }
  const maxV = Math.max(0.001, ...months.map(x => x.v));
  const avg = months.reduce((a,x) => a + x.v, 0) / months.length;
  const bars = months.map((x, i) => {
    const cur = i === months.length - 1;
    return { month: x.m, value: x.v >= 100 ? Math.round(x.v) + 'K' : x.v.toFixed(1) + 'K',
      h: Math.max(4, Math.round(x.v / maxV * 112)), delay: (i * 0.07).toFixed(2),
      labelColor: cur ? 'var(--gold)' : 'var(--t3)',
      fill: cur ? 'linear-gradient(180deg,#E7D3A4,#A9884A)' : 'linear-gradient(180deg,var(--hair),var(--hairsoft))',
      glow: cur ? '0 10px 26px -10px rgba(150,116,45,.8)' : 'none' };
  });

  // insight: หมวดที่โตสุดเทียบเดือนก่อน
  let insight = 'บันทึกรายการอย่างต่อเนื่อง ระบบจะสรุปข้อสังเกตการใช้จ่ายให้อัตโนมัติ';
  const tm = new Date(); const thisS = ymd(new Date(tm.getFullYear(), tm.getMonth(), 1));
  const lastS = ymd(new Date(tm.getFullYear(), tm.getMonth() - 1, 1)), lastE = ymd(new Date(tm.getFullYear(), tm.getMonth(), 0));
  const catNow = {}, catPrev = {};
  txs.forEach(x => {
    if (x.tx_date >= thisS) catNow[x.category] = (catNow[x.category] || 0) + Number(x.amount);
    else if (x.tx_date >= lastS && x.tx_date <= lastE) catPrev[x.category] = (catPrev[x.category] || 0) + Number(x.amount);
  });
  let bestK = null, bestG = 0;
  Object.keys(catNow).forEach(k => {
    if (catPrev[k] > 0) { const g = (catNow[k] - catPrev[k]) / catPrev[k] * 100; if (g > bestG) { bestG = g; bestK = k; } }
  });
  if (bestK && bestG >= 5) insight = `หมวด${catLabel(bestK)}โตขึ้น ${Math.round(bestG)}% จากเดือนก่อน (฿${money(catNow[bestK])}) — ลองตั้งงบประมาณรายเดือนของหมวดนี้ เพื่อคุมยอดรวมปลายเดือน`;
  else if (Object.keys(catNow).length) {
    const topK = Object.keys(catNow).sort((a,b) => catNow[b] - catNow[a])[0];
    insight = `เดือนนี้ใช้จ่ายหมวด${catLabel(topK)}มากที่สุด ฿${money(catNow[topK])} — คิดเป็น ${Math.round(catNow[topK] / Math.max(1, monthTotal(0)) * 100)}% ของทั้งเดือน`;
  }

  app.innerHTML = `
  <div style="padding:24px 22px 130px;" class="u-fadein">
    <div class="screen-title">วิเคราะห์การใช้จ่าย</div>

    <div style="margin-top:20px; position:relative; padding:22px 18px; border-radius:24px; background:linear-gradient(160deg, var(--raised), var(--hairsoft)); border:1px solid var(--hair); overflow:hidden;">
      <div class="aura" style="width:280px; height:280px; right:-90px; top:-110px; background:radial-gradient(circle, rgba(150,116,45,.14), rgba(150,116,45,0) 68%);"></div>
      ${catTotal > 0 ? `
      <div style="position:relative; display:flex; align-items:center; gap:20px;">
        <div style="position:relative; width:132px; height:132px; flex:0 0 132px;">
          <svg width="132" height="132" viewBox="0 0 132 132" style="transform:rotate(-90deg);">
            <circle cx="66" cy="66" r="55" fill="none" stroke="var(--hairsoft)" stroke-width="14"></circle>
            ${donut.map(d => `<circle cx="66" cy="66" r="55" fill="none" stroke="${d.color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${d.dash}" stroke-dashoffset="${d.offset}" style="animation:fadeIn .7s both; animation-delay:${d.delay}s;"></circle>`).join('')}
          </svg>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div style="font-size:12.5px; letter-spacing:1.4px; color:var(--t2); text-transform:uppercase;">รวม</div>
            <div class="tnum" style="font-size:17.5px; font-weight:600; color:var(--t1);">฿${money(catTotal)}</div>
          </div>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:9px;">
          ${donut.map(d => `
          <div style="display:flex; align-items:center; gap:9px; animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:${d.delay}s;">
            <span style="width:8px; height:8px; border-radius:50%; display:block; background:${d.color};"></span>
            <span style="flex:1; font-size:15.5px; color:var(--t1b); opacity:.85;">${d.label}</span>
            <span class="tnum" style="font-size:15px; color:var(--t2);">${d.pct}%</span>
          </div>`).join('')}
        </div>
      </div>` : `<div style="position:relative; padding:26px 0; text-align:center; color:var(--t2); font-size:15.5px;">ยังไม่มีข้อมูล — เริ่มจดรายการก่อน</div>`}
    </div>

    <div style="margin-top:22px; display:flex; align-items:center; justify-content:space-between;">
      <span class="eyebrow">6 เดือนย้อนหลัง</span>
      <span class="tnum" style="white-space:nowrap; font-size:14.5px; color:var(--t2);">เฉลี่ย ฿${avg.toFixed(1)}K</span>
    </div>
    <div style="margin-top:16px; display:flex; align-items:flex-end; gap:11px; height:150px;">
      ${bars.map(b => `
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end;">
        <span class="tnum" style="font-size:12.5px; color:${b.labelColor};">${b.value}</span>
        <div style="width:100%; height:${b.h}px; border-radius:9px 9px 4px 4px; background:${b.fill}; transform-origin:bottom; animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both; animation-delay:${b.delay}s; box-shadow:${b.glow};"></div>
        <span style="font-size:12.5px; color:var(--t2);">${b.month}</span>
      </div>`).join('')}
    </div>

    <div style="margin-top:26px; padding:16px 17px; border-radius:20px; background:rgba(150,116,45,.07); border:1px solid rgba(150,116,45,.18); animation:fadeUp .5s .3s both;">
      <div style="font-size:13px; letter-spacing:1.8px; text-transform:uppercase; color:var(--gold);">ข้อสังเกต</div>
      <div style="margin-top:8px; font-size:16px; line-height:1.85; color:var(--t1b); opacity:.85; text-wrap:pretty;">${esc(insight)}</div>
    </div>
  </div>`;
}

/* ---------- SHEETS ---------- */
function openSheet(html) { $('sheetHost').innerHTML = `<div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>${html}</div>`; $('sheetHost').classList.add('open'); }
window.closeSheet = () => { $('sheetHost').classList.remove('open'); $('sheetHost').innerHTML = ''; };

/* ปฏิทิน (ดีไซน์: bottom sheet, ห้ามเลือกอนาคต) */
window.openCal = (target) => {
  S.calTarget = target;
  const d = target === 'edit' ? new Date(S.editTx.tx_date + 'T00:00:00') : dateFromOffset(S.dayOffset);
  S.calY = d.getFullYear(); S.calM = d.getMonth();
  renderCal();
};
function renderCal() {
  const t = new Date(); t.setHours(0,0,0,0);
  const selDate = S.calTarget === 'edit' ? new Date(S.editTx.tx_date + 'T00:00:00') : dateFromOffset(S.dayOffset);
  const first = new Date(S.calY, S.calM, 1).getDay();
  const days = new Date(S.calY, S.calM + 1, 0).getDate();
  const atCurrent = S.calY > t.getFullYear() || (S.calY === t.getFullYear() && S.calM >= t.getMonth());
  let cellsHtml = '';
  for (let i = 0; i < first; i++) cellsHtml += `<div class="cal-cell blank"></div>`;
  for (let d = 1; d <= days; d++) {
    const cd = new Date(S.calY, S.calM, d);
    const future = cd > t;
    const today = cd.getTime() === t.getTime();
    const selc = cd.getTime() === selDate.getTime();
    cellsHtml += `<div class="cal-cell ${future ? 'future' : ''} ${today && !selc ? 'today' : ''} ${selc ? 'selc' : ''}" ${future ? '' : `onclick="calPick(${d})"`}>${d}</div>`;
  }
  openSheet(`
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div onclick="calStep(-1)" style="width:42px; height:42px; border-radius:12px; background:var(--sunken); display:flex; align-items:center; justify-content:center; font-size:19.5px; color:var(--gold); cursor:pointer; user-select:none;">‹</div>
      <div style="white-space:nowrap; font-size:19px; font-weight:700; color:var(--t1b);">${THM_FULL[S.calM]} ${S.calY + 543}</div>
      <div onclick="calStep(1)" style="width:42px; height:42px; border-radius:12px; background:var(--sunken); display:flex; align-items:center; justify-content:center; font-size:19.5px; color:var(--gold); cursor:pointer; user-select:none; opacity:${atCurrent ? '.3' : '1'};">›</div>
    </div>
    <div style="margin-top:16px; display:grid; grid-template-columns:repeat(7,1fr); gap:5px;">
      ${['อา','จ','อ','พ','พฤ','ศ','ส'].map(w => `<div style="text-align:center; font-size:13px; font-weight:700; letter-spacing:.4px; color:var(--t2);">${w}</div>`).join('')}
    </div>
    <div style="margin-top:8px; display:grid; grid-template-columns:repeat(7,1fr); gap:5px;">${cellsHtml}</div>
    <div style="margin-top:18px; display:flex; gap:10px;">
      <div onclick="calToday()" style="flex:1; height:48px; border-radius:16px; background:var(--sunken); border:1px solid var(--hair); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; color:var(--t1b); cursor:pointer;">วันนี้</div>
      <button class="cta" style="flex:1.4; height:48px; border-radius:16px; font-size:17.5px;" onclick="calDone()">เสร็จสิ้น</button>
    </div>`);
}
window.calStep = (n) => {
  const t = new Date();
  if (n > 0 && (S.calY > t.getFullYear() || (S.calY === t.getFullYear() && S.calM >= t.getMonth()))) return;
  S.calM += n;
  if (S.calM < 0) { S.calM = 11; S.calY--; }
  if (S.calM > 11) { S.calM = 0; S.calY++; }
  renderCal();
};
window.calPick = (d) => {
  const picked = new Date(S.calY, S.calM, d);
  if (S.calTarget === 'edit') { S.editTx.tx_date = ymd(picked); }
  else {
    const t = new Date(); t.setHours(0,0,0,0);
    S.dayOffset = Math.round((t - picked) / 86400000);
  }
  renderCal();
};
window.calToday = () => {
  if (S.calTarget === 'edit') S.editTx.tx_date = ymd(new Date());
  else S.dayOffset = 0;
  const t = new Date(); S.calY = t.getFullYear(); S.calM = t.getMonth();
  renderCal();
};
window.calDone = () => {
  closeSheet();
  if (S.calTarget === 'edit') openTxSheetRender();
  else renderAddPanel();
};

  updPayUI();
};

      <div class="fieldrow"><label>จำนวนงวด</label><input id="pTotal" type="number" min="1" max="60" inputmode="numeric" value="${editPlan ? editPlan.total_terms : 10}"></div>
      <div class="fieldrow"><label>จ่ายแล้ว (งวด)</label><input id="pPaid" type="number" min="0" max="60" inputmode="numeric" value="${editPlan ? editPlan.terms_paid : 0}"></div>
      <div class="fieldrow"><label>เริ่มเมื่อ</label><input id="pStart" type="month" value="${editPlan ? editPlan.start_date.slice(0,7) : ymd(new Date()).slice(0,7)}"></div>
    </div>
    <div style="margin-top:18px; display:flex; gap:10px;">
      ${editPlan ? `<div onclick="deletePlan()" style="flex:1; height:52px; border-radius:16px; background:rgba(169,100,15,.08); border:1px solid rgba(169,100,15,.25); display:flex; align-items:center; justify-content:center; font-size:15.5px; font-weight:600; color:var(--warn); cursor:pointer;">ลบ</div>` : ''}
      ${editPlan && editPlan.terms_paid < editPlan.total_terms ? `<div onclick="payTerm()" style="flex:1.2; height:52px; border-radius:16px; background:rgba(46,125,85,.1); border:1px solid rgba(46,125,85,.3); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--success); cursor:pointer;">✓ จ่ายงวดนี้</div>` : ''}
      <button class="cta" style="flex:1.6; height:52px; font-size:17px;" onclick="savePlan()">${editPlan ? 'บันทึก' : 'เพิ่ม'}</button>
    </div>`);
};
window.pickPlanIcon = (ic) => {
  pickedPlanIcon = ic;
  document.querySelectorAll('#planIconRow .chip').forEach(el => el.classList.toggle('sel', el.textContent === ic));
};
window.savePlan = async () => {
  const name = $('pName').value.trim();
  const per = parseFloat($('pPer').value);
  const total = parseInt($('pTotal').value, 10);
  let paid = parseInt($('pPaid').value, 10) || 0;
  if (!name || !per || per <= 0 || !total || total < 1) return alert('กรุณากรอกชื่อ ยอดต่อเดือน และจำนวนงวดให้ครบ');
  paid = Math.min(paid, total);
  const payload = {
    icon: pickedPlanIcon, name, card_id: $('pCard').value || null,
    per_month: per, total_terms: total, terms_paid: paid,
    start_date: ($('pStart').value || ymd(new Date()).slice(0,7)) + '-01',
  };
  const q = editPlan ? sb.from('plans').update(payload).eq('id', editPlan.id) : sb.from('plans').insert(payload);
  const { error } = await q;
  if (error) return alert('บันทึกไม่สำเร็จ: ' + error.message);
  closeSheet(); await loadData(); render();
};
window.payTerm = async () => {
  const { error } = await sb.from('plans').update({ terms_paid: Math.min(editPlan.terms_paid + 1, editPlan.total_terms) }).eq('id', editPlan.id);
  if (error) return alert('อัปเดตไม่สำเร็จ: ' + error.message);
  closeSheet(); await loadData(); render();
};
window.deletePlan = async () => {
  if (!confirm('ลบรายการผ่อนนี้?')) return;
  const { error } = await sb.from('plans').delete().eq('id', editPlan.id);
  if (error) return alert('ลบไม่สำเร็จ: ' + error.message);
  closeSheet(); await loadData(); render();
};

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- boot ---------- */
(async function boot() {
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) { render(); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) await loadData();
  render();
  sb.auth.onAuthStateChange(async (_ev, s) => {
    const wasIn = !!session;
    session = s;
    if (s && !wasIn) { await loadData(); S.screen = 'home'; render(); }
    if (!s && wasIn) { cards = []; txs = []; plans = []; S.screen = 'home'; render(); }
  });
})();
</script>
</body>
</html>
