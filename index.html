<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4652c9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="จดบัตร">
<title>จดบัตรเครดิต — บันทึกรายการใช้จ่าย</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="supabase.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #f2f3fa;
    --card-bg: #ffffff;
    --ink: #23263b;
    --muted: #7a7f9a;
    --line: #e6e8f2;
    --accent: #4652c9;
    --accent-soft: #eceefc;
    --green: #14a06a;
    --green-soft: #e2f6ec;
    --red: #d9435f;
    --red-soft: #fdeaee;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(35, 38, 59, .07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Prompt', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 90px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 2px 18px;
  }
  header.top h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .01em; }
  header.top h1 span { color: var(--accent); }
  .userbox { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); max-width: 55%; }
  .userbox .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn {
    font-family: inherit; font-size: .92rem; font-weight: 500;
    border: none; border-radius: 12px; padding: 11px 18px;
    cursor: pointer; transition: filter .15s, transform .05s;
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); padding: 8px 10px; }
  .btn-soft { background: var(--accent-soft); color: var(--accent); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-danger-soft { background: var(--red-soft); color: var(--red); }
  .btn-sm { font-size: .8rem; padding: 7px 12px; border-radius: 10px; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: .55; cursor: default; }

  /* ---------- auth ---------- */
  .auth-hero { text-align: center; margin: 42px 0 26px; }
  .auth-hero .logo {
    width: 74px; height: 50px; margin: 0 auto 16px; border-radius: 10px;
    background: linear-gradient(135deg, #5b6ee8, #8b5cf6);
    position: relative; box-shadow: var(--shadow);
  }
  .auth-hero .logo::before {
    content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 9px; background: rgba(20,22,50,.35);
  }
  .auth-hero .logo::after {
    content: ""; position: absolute; left: 10px; bottom: 8px; width: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.75);
  }
  .auth-hero h2 { font-size: 1.35rem; font-weight: 600; }
  .auth-hero p { color: var(--muted); font-size: .88rem; margin-top: 4px; }
  .panel {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px;
  }
  .tabs { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs button {
    flex: 1; border: none; background: transparent; font-family: inherit;
    padding: 9px; border-radius: 9px; font-size: .9rem; font-weight: 500;
    color: var(--muted); cursor: pointer;
  }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(35,38,59,.08); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; font-family: inherit; font-size: 1rem;
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 14px; background: #fff; color: var(--ink);
    outline: none; transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .msg { font-size: .84rem; border-radius: 10px; padding: 10px 13px; margin-bottom: 14px; display: none; }
  .msg.err { display: block; background: var(--red-soft); color: var(--red); }
  .msg.ok { display: block; background: var(--green-soft); color: var(--green); }

  /* ---------- summary ---------- */
  .summary {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px;
  }
  .sumbox { background: var(--card-bg); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .sumbox .t { font-size: .74rem; color: var(--muted); }
  .sumbox .v { font-size: 1.15rem; font-weight: 600; margin-top: 2px; }
  .sumbox .v.red { color: var(--red); }
  .sumbox .v.green { color: var(--green); }

  /* ---------- credit cards ---------- */
  .cc {
    border-radius: 18px; padding: 18px 20px; color: #fff; cursor: pointer;
    margin-bottom: 14px; box-shadow: 0 8px 24px rgba(35,38,59,.18);
    position: relative; overflow: hidden;
  }
  .cc::after {
    content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px;
    border-radius: 50%; background: rgba(255,255,255,.12);
  }
  .cc .chip { width: 34px; height: 24px; border-radius: 6px; background: linear-gradient(135deg,#f6d76a,#d9a93f); margin-bottom: 12px; }
  .cc .name { font-size: 1.05rem; font-weight: 600; }
  .cc .meta { font-size: .74rem; opacity: .85; margin-top: 2px; }
  .cc .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; }
  .cc .lbl { font-size: .7rem; opacity: .85; }
  .cc .amt { font-size: 1.2rem; font-weight: 600; }
  .cc .amt.zero { opacity: .85; font-size: .95rem; font-weight: 500; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: .9rem; }
  .empty .big { font-size: 2.2rem; margin-bottom: 10px; }

  /* ---------- detail ---------- */
  .backrow { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
  .txlist { margin-top: 14px; }
  .tx {
    background: var(--card-bg); border-radius: 14px; padding: 12px 14px;
    margin-bottom: 9px; box-shadow: var(--shadow);
  }
  .tx.paid { background: var(--green-soft); }
  .tx.paid .n { text-decoration: line-through; color: #3d6b55; }
  .tx.paid .d { color: #6b9c86; }
  .tx.paid .a { color: var(--green); }
  .tx.paid .txcat { background: #fff; }
  .paidtoggle { display: flex; align-items: center; gap: 10px; font-size: .9rem; cursor: pointer; padding: 4px 0; }
  .paidtoggle input { width: 22px; height: 22px; accent-color: var(--green); cursor: pointer; }
  .paidtoggle small { display: block; color: var(--muted); font-size: .74rem; }
  .txrow { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .chev { color: var(--muted); font-size: .75rem; transition: transform .2s; }
  .tx.open .chev { transform: rotate(180deg); }
  .txdetail { border-top: 1px dashed var(--line); margin-top: 11px; padding-top: 9px; }
  .dl { display: flex; justify-content: space-between; font-size: .84rem; padding: 3.5px 0; color: var(--muted); }
  .dl b { color: var(--ink); font-weight: 500; text-align: right; }
  .stat-paid { color: var(--green) !important; }
  .stat-unpaid { color: var(--red) !important; }
  .dl-actions { display: flex; gap: 8px; margin-top: 10px; }
  .dl-actions .btn { flex: 1; }
  .tx .chk {
    width: 26px; height: 26px; min-width: 26px; border-radius: 8px;
    border: 2px solid var(--line); background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem; color: #fff; transition: all .15s;
  }
  .tx.paid .chk { background: var(--green); border-color: var(--green); }
  .tx .txcat {
    font-size: 1.2rem; width: 36px; min-width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border-radius: 11px;
  }
  .catpick { display: flex; gap: 8px; flex-wrap: wrap; }
  .catpick .cp {
    border: 1.5px solid var(--line); background: #fff; border-radius: 12px;
    padding: 8px 12px; font-size: .85rem; cursor: pointer; font-family: inherit;
    display: inline-flex; gap: 6px; align-items: center; color: var(--ink);
  }
  .catpick .cp.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .tx .info { flex: 1; min-width: 0; }
  .tx .n { font-weight: 500; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .d { font-size: .74rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .right { text-align: right; }
  .tx .a { font-weight: 600; font-size: .98rem; white-space: nowrap; }

  .payall { margin: 4px 0 2px; }
  .paylist { max-height: 44vh; overflow-y: auto; margin-bottom: 10px; }
  .payrow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .payrow.sel { border-color: var(--green); background: var(--green-soft); }
  .payrow .chk {
    width: 24px; height: 24px; min-width: 24px; border-radius: 7px;
    border: 2px solid var(--line); background: #fff; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: .8rem;
  }
  .payrow.sel .chk { background: var(--green); border-color: var(--green); }
  .payrow .pn { flex: 1; min-width: 0; font-size: .88rem; font-weight: 500; }
  .payrow .pn small { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }
  .payrow .pa { font-weight: 600; font-size: .9rem; white-space: nowrap; }
  .paytotal { text-align: center; font-size: .86rem; color: var(--muted); margin-bottom: 10px; font-weight: 500; }

  /* ---------- fab & modal ---------- */
  .fab {
    position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 1.7rem; cursor: pointer;
    box-shadow: 0 8px 22px rgba(70,82,201,.45); z-index: 40;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(20,22,40,.45); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 560px;
    border-radius: 20px 20px 0 0; padding: 22px 20px calc(26px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
  }
  @media (min-width: 600px) {
    .modal-bg { align-items: center; }
    .modal { border-radius: 20px; max-width: 420px; }
  }
  .modal h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }
  .modal .btnrow { display: flex; gap: 10px; margin-top: 6px; }
  .modal .btnrow .btn { flex: 1; }
  .colorpick { display: flex; gap: 10px; flex-wrap: wrap; }
  .colorpick .c { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
  .colorpick .c.sel { border-color: var(--ink); }

  .toolbar { display: flex; gap: 8px; margin: 4px 0 14px; flex-wrap: wrap; }
  .loading { text-align: center; color: var(--muted); padding: 50px 0; }
  .spin {
    width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: sp 0.8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .setupbox { line-height: 1.7; font-size: .9rem; }
  .setupbox code { background: var(--bg); padding: 2px 7px; border-radius: 6px; font-size: .82rem; }

  /* ---------- install banner ---------- */
  .install-banner {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    max-width: 536px; margin: 0 auto; z-index: 60;
    background: #23263b; color: #fff; border-radius: 16px;
    padding: 14px 16px; display: none; align-items: center; gap: 12px;
    box-shadow: 0 10px 30px rgba(20,22,40,.4);
    animation: slideup .3s ease;
  }
  @keyframes slideup { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .install-banner.show { display: flex; }
  .install-banner img { width: 40px; height: 40px; border-radius: 10px; }
  .install-banner .txt { flex: 1; min-width: 0; }
  .install-banner .t1 { font-size: .88rem; font-weight: 600; }
  .install-banner .t2 { font-size: .74rem; opacity: .8; line-height: 1.45; }
  .install-banner .t2 .ic { display: inline-block; }
  .install-banner .close {
    background: none; border: none; color: #fff; opacity: .6;
    font-size: 1.2rem; cursor: pointer; padding: 4px 6px; align-self: flex-start;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div class="spin"></div>กำลังโหลด…</div>
</div>

<div class="install-banner" id="installBanner">
  <img src="icons/icon-192.png" alt="">
  <div class="txt">
    <div class="t1">ติดตั้ง "จดบัตร" เป็นแอป</div>
    <div class="t2" id="installHint">ใช้งานเต็มจอ เปิดเร็ว เหมือนแอปจริง</div>
  </div>
  <button class="btn btn-primary btn-sm" id="installBtn">ติดตั้ง</button>
  <button class="close" id="installClose">×</button>
</div>

<script>
"use strict";
const CFG = window.APP_CONFIG || {};
let sb = null;
let session = null;
let cards = [];
let txs = [];
let view = { name: "cards", cardId: null };
const TH_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
let sumYear = "all", sumMonth = "all", sumStatus = "all"; // ตัวกรองหน้าสรุป
let detYear = "all", detMonth = "all", detStatus = "all"; // ตัวกรองหน้าบัตร
let expandedTx = null;
let sortDesc = true; // true = ใหม่ไปเก่า
let paySel = new Set();
let editingTx = null;
let editingCard = null;
let pickedColor = "#5b6ee8";

const COLORS = ["#5b6ee8", "#8b5cf6", "#0ea5b7", "#14a06a", "#e8842c", "#d9435f", "#2d3250", "#b8860b", "#c0c7d1"];

const CATS = [
  { k: "food", icon: "🍔", label: "อาหาร" },
  { k: "shopping", icon: "🛍️", label: "ช้อปปิ้ง" },
  { k: "clothes", icon: "👕", label: "เสื้อผ้า" },
  { k: "shoes", icon: "👟", label: "รองเท้า" },
  { k: "bag", icon: "👜", label: "กระเป๋า" },
  { k: "shopee", icon: "🛒", label: "Shopee" },
  { k: "fuel", icon: "⛽", label: "น้ำมัน" },
  { k: "phone", icon: "📱", label: "ค่าโทรศัพท์" },
  { k: "other", icon: "📦", label: "อื่นๆ" },
];
const catOf = (k) => CATS.find((c) => c.k === k) || CATS[CATS.length - 1];
let pickedCat = "other";

// สีอ่อน (เช่น สีเงิน) ต้องใช้ตัวหนังสือเข้มถึงจะอ่านออก
function isLightColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b > 150;
}
function cardStyle(color) {
  const c = color || "#5b6ee8";
  const ink = isLightColor(c) ? "color:#2b3040" : "color:#fff";
  return `background:linear-gradient(135deg, ${esc(c)}, ${esc(c)}cc); ${ink}`;
}
const $ = (id) => document.getElementById(id);
const app = $("app");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const thDate = (s) => new Date(s + "T00:00:00").toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" });
const thDateFull = (d) => d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" });

function authErrTh(m) {
  m = String(m || "");
  if (/invalid login credentials/i.test(m)) return "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
  if (/already registered/i.test(m)) return "อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบแทน";
  if (/at least 6/i.test(m) || /password/i.test(m) && /short|weak/i.test(m)) return "รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร";
  if (/rate limit/i.test(m)) return "ลองบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่";
  if (/not confirmed/i.test(m)) return "อีเมลนี้ยังไม่ได้ยืนยัน กรุณาเช็กกล่องจดหมาย";
  return "เกิดข้อผิดพลาด: " + m;
}

/* ---------- data ---------- */
async function loadData() {
  const [c, t] = await Promise.all([
    sb.from("cards").select("*").order("created_at"),
    sb.from("transactions").select("*").order("tx_date", { ascending: false }).order("created_at", { ascending: false }),
  ]);
  if (c.error || t.error) { alert("โหลดข้อมูลไม่สำเร็จ: " + (c.error || t.error).message); return; }
  cards = c.data; txs = t.data;
}

/* ---------- render ---------- */
function render() {
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) return renderSetup();
  if (!session) return renderAuth();
  if (view.name === "detail") return renderDetail();
  if (view.name === "summary") return renderSummary();
  return renderCards();
}

function renderSetup() {
  app.innerHTML = `
    <div class="auth-hero"><div class="logo"></div><h2>จดบัตรเครดิต</h2><p>ยังตั้งค่าไม่เสร็จ</p></div>
    <div class="panel setupbox">
      แอปยังไม่ได้เชื่อมกับฐานข้อมูล Supabase<br>
      กรุณาใส่ค่า <code>SUPABASE_URL</code> และ <code>SUPABASE_ANON_KEY</code> ในไฟล์ <code>config.js</code> แล้ว deploy ใหม่อีกครั้ง
      (ดูขั้นตอนใน README.md)
    </div>`;
}

function renderAuth() {
  app.innerHTML = `
    <div class="auth-hero"><div class="logo"></div><h2>จดบัตรเครดิต</h2><p>บันทึกรายการใช้จ่าย แยกบัตร แยกรอบบิล</p></div>
    <div class="panel">
      <div class="tabs">
        <button id="tabLogin" class="active">เข้าสู่ระบบ</button>
        <button id="tabSignup">สมัครใหม่</button>
      </div>
      <div class="msg" id="authMsg"></div>
      <form id="authForm">
        <div class="field"><label>อีเมล</label><input type="email" id="aEmail" required autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input type="password" id="aPass" required minlength="6" autocomplete="current-password" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-block" id="aBtn" type="submit">เข้าสู่ระบบ</button>
      </form>
    </div>`;
  let mode = "login";
  const setMode = (m) => {
    mode = m;
    $("tabLogin").classList.toggle("active", m === "login");
    $("tabSignup").classList.toggle("active", m === "signup");
    $("aBtn").textContent = m === "login" ? "เข้าสู่ระบบ" : "สมัครสมาชิก";
  };
  $("tabLogin").onclick = () => setMode("login");
  $("tabSignup").onclick = () => setMode("signup");
  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("aEmail").value.trim(), password = $("aPass").value;
    const msg = $("authMsg"); msg.className = "msg"; $("aBtn").disabled = true;
    try {
      if (mode === "login") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (!data.session) {
          msg.className = "msg ok";
          msg.textContent = "สมัครแล้ว! ระบบส่งลิงก์ยืนยันไปที่อีเมลของคุณ กรุณากดยืนยันก่อนเข้าสู่ระบบ";
        }
      }
    } catch (err) {
      msg.className = "msg err"; msg.textContent = authErrTh(err.message);
    }
    $("aBtn").disabled = false;
  };
}

function cardUnpaid(cardId) {
  return txs.filter((t) => t.card_id === cardId && !t.paid).reduce((s, t) => s + Number(t.amount), 0);
}

function renderCards() {
  const totalUnpaid = txs.filter((t) => !t.paid).reduce((s, t) => s + Number(t.amount), 0);
  const now = new Date();
  const ms = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
  const me = ymd(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  const monthTotal = txs.filter((t) => t.tx_date >= ms && t.tx_date <= me).reduce((s, t) => s + Number(t.amount), 0);

  let cardsHtml = cards.map((c) => {
    const unpaid = cardUnpaid(c.id);
    const cnt = txs.filter((t) => t.card_id === c.id).length;
    return `
    <div class="cc" style="${cardStyle(c.color)}" onclick="openCard('${c.id}')">
      <div class="chip"></div>
      <div class="name">${esc(c.name)}</div>
      <div class="meta">${cnt} รายการ</div>
      <div class="row">
        <div><div class="lbl">ค้างจ่ายทั้งหมด</div>
          ${unpaid > 0 ? `<div class="amt">฿${money(unpaid)}</div>` : `<div class="amt zero">จ่ายครบแล้ว ✓</div>`}
        </div>
        <div style="font-size:1.3rem;opacity:.9">›</div>
      </div>

  }).join("");

  if (!cards.length) {
    cardsHtml = `<div class="empty"><div class="big">💳</div>ยังไม่มีบัตร<br>กดปุ่ม + ด้านล่างเพื่อเพิ่มบัตรใบแรก</div>`;
  }

  app.innerHTML = `
    <header class="top">
      <h1>จด<span>บัตรเครดิต</span></h1>
      <div class="userbox"><span class="email">${esc(session.user.email)}</span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">ออก</button></div>
    </header>
    <div class="summary">
      <div class="sumbox"><div class="t">ค้างจ่ายรวมทุกบัตร</div><div class="v ${totalUnpaid > 0 ? "red" : "green"}">฿${money(totalUnpaid)}</div></div>
      <div class="sumbox"><div class="t">ใช้ไปเดือนนี้</div><div class="v">฿${money(monthTotal)}</div></div>
    </div>
    ${cards.length ? `<div class="toolbar">
      <button class="btn btn-soft btn-sm" onclick="openSummary()">📊 สรุป</button>
      <button class="btn btn-soft btn-sm" onclick="exportCSV()">⬇ ส่งออก CSV ทั้งหมด</button>
    </div>` : ""}
    ${cardsHtml}
    <button class="fab" onclick="openCardModal()" title="เพิ่มบัตร">+</button>

    const cmp = a.tx_date.localeCompare(b.tx_date) || String(a.created_at || "").localeCompare(String(b.created_at || ""));

      <div class="txdetail">
        <div class="dl"><span>วันที่</span><b>${thDateFull(new Date(t.tx_date + "T00:00:00"))}</b></div>
        <div class="dl"><span>หมวดหมู่</span><b>${cat.icon} ${cat.label}</b></div>
        <div class="dl"><span>สถานที่</span><b>${t.place ? esc(t.place) : "—"}</b></div>
        <div class="dl"><span>ราคา</span><b>฿${money(t.amount)}</b></div>
        <div class="dl"><span>สถานะ</span><b class="${t.paid ? "stat-paid" : "stat-unpaid"}">${t.paid ? "จ่ายแล้ว ✓" : "ยังไม่จ่าย"}</b></div>
        <div class="dl-actions">
          <button class="btn btn-soft btn-sm" onclick="openTxModal('${t.id}')">✏️ แก้ไข</button>
          <button class="btn btn-danger-soft btn-sm" onclick="delTx('${t.id}')">🗑 ลบ</button>
        </div>
      </div>` : ""}
    </div>`;
  }).join("");

  // การ์ดทุกใบใน carousel — ปัดเพื่อสลับบัตร
  const carouselHtml = cards.map((c) => {
    const cAll = txs.filter((t) => t.card_id === c.id);
    const cTotal = cAll.reduce((s, t) => s + Number(t.amount), 0);

      <div class="row">

      </div>

  const statusChips = [["all", "ทั้งหมด"], ["paid", "จ่ายแล้ว"], ["unpaid", "ยังไม่จ่าย"]];

  app.innerHTML = `

      <button class="btn btn-ghost" onclick="backHome()">‹ กลับ</button>

    ${cards.length > 1 ? `<div style="display:flex; justify-content:center; gap:6px; margin-bottom:10px;">
      ${cards.map((c, i) => `<span style="width:${i === idx ? 18 : 7}px; height:7px; border-radius:99px; background:${i === idx ? "var(--accent)" : "var(--line)"}; transition:.3s;"></span>`).join("")}
    </div>` : `<div style="margin-bottom:6px;"></div>`}
    ${unpaidCnt > 0 ? `<button class="btn btn-green btn-block payall" onclick="openPayModal('${card.id}')">💳 จ่ายบิล (ค้าง ${unpaidCnt} รายการ · ฿${money(unpaid)})</button>` : ""}

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 8px;">
      <div class="field" style="margin:0;">

    </div>
    <button class="fab" onclick="openTxModal()" title="จดรายการ">+</button>
    ${modalHtml()}`;

  // ตั้งตำแหน่ง carousel ให้ตรงบัตรปัจจุบัน แล้วฟังการปัดเพื่อสลับบัตร
  const car = $("detCar");
  if (car) {
    const step = () => (car.firstElementChild ? car.firstElementChild.offsetWidth + 12 : car.clientWidth || 1);
    requestAnimationFrame(() => { car.scrollLeft = idx * step(); });
    let scT = 0;
    car.addEventListener("scroll", () => {
      clearTimeout(scT);
      scT = setTimeout(() => {
        const i = Math.min(cards.length - 1, Math.max(0, Math.round(car.scrollLeft / step())));
        if (cards[i] && cards[i].id !== view.cardId) { view.cardId = cards[i].id; expandedTx = null; render(); }
      }, 150);
    }, { passive: true });
  }
}
window.setDetYear = (v) => { detYear = v; render(); };
window.setDetMonth = (v) => { detMonth = v; render(); };

window.openSummary = () => { view = { name: "summary", cardId: null }; render(); };
window.setSumYear = (v) => { sumYear = v; render(); };
window.setSumMonth = (v) => { sumMonth = v; render(); };
window.setSumStatus = (v) => { sumStatus = v; render(); };

function renderSummary() {
  const list = txs.filter((t) => {
    if (sumYear !== "all" && t.tx_date.slice(0, 4) !== sumYear) return false;
    if (sumMonth !== "all" && t.tx_date.slice(5, 7) !== sumMonth) return false;
    if (sumStatus === "paid" && !t.paid) return false;
    if (sumStatus === "unpaid" && t.paid) return false;
    return true;
  });
  const total = list.reduce((s, t) => s + Number(t.amount), 0);
  const paidSum = list.filter((t) => t.paid).reduce((s, t) => s + Number(t.amount), 0);
  const unpaidSum = list.filter((t) => !t.paid).reduce((s, t) => s + Number(t.amount), 0);

  const years = [...new Set(txs.map((t) => t.tx_date.slice(0, 4)))].sort().reverse();
  if (!years.length) years.push(String(new Date().getFullYear()));

  // แยกตามบัตร
  const byCard = cards.map((c) => {
    const l = list.filter((t) => t.card_id === c.id);
    return { c, sum: l.reduce((s, t) => s + Number(t.amount), 0), cnt: l.length };
  }).filter((x) => x.cnt > 0).sort((a, b) => b.sum - a.sum);

  // แยกตามหมวด
  const byCat = {};
  list.forEach((t) => { const k = t.category || "other"; byCat[k] = (byCat[k] || 0) + Number(t.amount); });
  const catRows = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);

  const statusChips = [["all", "ทั้งหมด"], ["paid", "จ่ายแล้ว"], ["unpaid", "ยังไม่จ่าย"]];
  const periodLabel = (sumMonth !== "all" ? TH_MONTHS[Number(sumMonth) - 1] + " " : "")
    + (sumYear !== "all" ? "ปี " + (Number(sumYear) + 543) : (sumMonth !== "all" ? "ทุกปี" : "ทุกช่วงเวลา"));

  app.innerHTML = `
    <div class="backrow">
      <button class="btn btn-ghost" onclick="backHome()">‹ กลับ</button>
      <div style="flex:1"></div>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">⬇ CSV</button>
    </div>
    <h1 style="font-size:1.25rem; font-weight:600; margin:2px 2px 12px;">📊 สรุปค่าใช้จ่าย</h1>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
      <div class="field" style="margin:0;">
        <select onchange="setSumYear(this.value)" style="font-weight:500; ${sumYear !== "all" ? "border-color:var(--accent); color:var(--accent);" : ""}">
          <option value="all" ${sumYear === "all" ? "selected" : ""}>ทุกปี</option>
          ${years.map((y) => `<option value="${y}" ${sumYear === y ? "selected" : ""}>ปี ${Number(y) + 543}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="margin:0;">
        <select onchange="setSumMonth(this.value)" style="font-weight:500; ${sumMonth !== "all" ? "border-color:var(--accent); color:var(--accent);" : ""}">
          <option value="all" ${sumMonth === "all" ? "selected" : ""}>ทุกเดือน</option>
          ${TH_MONTHS.map((m, i) => { const v = String(i + 1).padStart(2, "0"); return `<option value="${v}" ${sumMonth === v ? "selected" : ""}>${m}</option>`; }).join("")}
        </select>
      </div>
    </div>
    <div class="catpick" style="margin-bottom:14px;">
      ${statusChips.map(([k, l]) => `<button type="button" class="cp ${sumStatus === k ? "sel" : ""}" onclick="setSumStatus('${k}')">${l}</button>`).join("")}
    </div>

    <div style="font-size:.8rem; color:var(--muted); margin:0 2px 8px;">${esc(periodLabel)} · ${list.length} รายการ</div>
    <div class="summary" style="grid-template-columns:1fr 1fr;">
      <div class="sumbox"><div class="t">ยอดรวม</div><div class="v">฿${money(total)}</div></div>
      <div class="sumbox"><div class="t">จำนวนรายการ</div><div class="v">${list.length}</div></div>
      <div class="sumbox"><div class="t">จ่ายแล้ว</div><div class="v green">฿${money(paidSum)}</div></div>
      <div class="sumbox"><div class="t">ค้างจ่าย</div><div class="v ${unpaidSum > 0 ? "red" : "green"}">฿${money(unpaidSum)}</div></div>
    </div>

    <div class="panel" style="margin-bottom:14px;">
      <div style="font-size:.85rem; font-weight:600; color:var(--muted); margin-bottom:10px;">แยกตามบัตร</div>
      ${byCard.length ? byCard.map(({ c, sum, cnt }) => `
      <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);">
        <span style="width:26px; height:18px; border-radius:4px; flex:0 0 auto; display:block; background:linear-gradient(135deg, ${esc(c.color)}, ${esc(c.color)}cc);"></span>
        <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.92rem;">${esc(c.name)}<small style="color:var(--muted);"> · ${cnt} รายการ</small></span>
        <b style="font-size:.95rem;">฿${money(sum)}</b>
      </div>`).join("") : `<div style="color:var(--muted); font-size:.88rem; text-align:center; padding:12px 0;">ไม่มีรายการในช่วงที่เลือก</div>`}
    </div>

    <div class="panel" style="margin-bottom:14px;">
      <div style="font-size:.85rem; font-weight:600; color:var(--muted); margin-bottom:10px;">แยกตามหมวดหมู่</div>
      ${catRows.length ? catRows.map((k) => {
        const c = catOf(k), v = byCat[k], pct = total > 0 ? Math.round(v / total * 100) : 0;
        return `
      <div style="padding:7px 0;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:1.05rem;">${c.icon}</span>
          <span style="flex:1; font-size:.92rem;">${c.label}</span>
          <span style="font-size:.8rem; color:var(--muted);">${pct}%</span>
          <b style="font-size:.95rem; min-width:80px; text-align:right;">฿${money(v)}</b>
        </div>
        <div style="margin-top:5px; height:6px; border-radius:99px; background:var(--bg); overflow:hidden;">
          <div style="height:100%; width:${pct}%; border-radius:99px; background:linear-gradient(90deg,#5b6ee8,#8b5cf6);"></div>
        </div>
      </div>`;
      }).join("") : `<div style="color:var(--muted); font-size:.88rem; text-align:center; padding:12px 0;">ไม่มีรายการในช่วงที่เลือก</div>`}
    </div>
    ${modalHtml()}`;
}

    <div class="modal" id="modalBody"></div>
  </div>`;
}
function closeModal() { $("modalBg").classList.remove("open"); }

window.openCardModal = (cardId) => {
  editingCard = cardId ? cards.find((c) => c.id === cardId) : null;
  pickedColor = editingCard ? editingCard.color : COLORS[cards.length % COLORS.length];

      <div class="field"><label>ชื่อบัตร</label>

      <div class="field"><label>สีบัตร</label>
        <div class="colorpick">${COLORS.map((c) => `<div class="c ${c === pickedColor ? "sel" : ""}" style="background:${c}" onclick="pickColor(this,'${c}')"></div>`).join("")}</div>

  $("modalBg").classList.add("open");
  $("cardForm").onsubmit = saveCard;
};
window.pickColor = (el, c) => {
  pickedColor = c;
  el.parentElement.querySelectorAll(".c").forEach((x) => x.classList.remove("sel"));
  el.classList.add("sel");
};
async function saveCard(e) {
  e.preventDefault();
  const payload = {
    name: $("cName").value.trim(),
    color: pickedColor,
  };
  const q = editingCard
    ? sb.from("cards").update(payload).eq("id", editingCard.id)
    : sb.from("cards").insert(payload);
  const { error } = await q;
  if (error) return alert("บันทึกไม่สำเร็จ: " + error.message);
  closeModal(); await loadData(); render();
}

window.openTxModal = (txId) => {
  editingTx = txId ? txs.find((t) => t.id === txId) : null;
  pickedCat = editingTx ? (editingTx.category || "other") : "other";
  $("modalBody").innerHTML = `
    <h3>${editingTx ? "แก้ไขรายการ" : "จดรายการใหม่"}</h3>
    <form id="txForm">
      <div class="field"><label>วันที่</label>
        <input type="date" id="tDate" required value="${editingTx ? editingTx.tx_date : ymd(new Date())}"></div>
      <div class="field"><label>ชื่อรายการ</label>
        <input id="tName" required maxlength="120" placeholder="เช่น ค่าอาหาร, เติมน้ำมัน" value="${editingTx ? esc(editingTx.name) : ""}"></div>
      <div class="field"><label>ราคา (บาท)</label>
        <input type="number" id="tAmount" required step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" value="${editingTx ? editingTx.amount : ""}"></div>
      <div class="field"><label>หมวดหมู่</label>
        <div class="catpick" id="catPick">
          ${CATS.map((c) => `<button type="button" class="cp ${c.k === pickedCat ? "sel" : ""}" onclick="pickCat('${c.k}')">${c.icon} ${c.label}</button>`).join("")}
        </div>
      </div>
      <div class="field"><label>สถานที่ (ไม่บังคับ)</label>
        <input id="tPlace" maxlength="120" placeholder="เช่น Lotus, Shopee" value="${editingTx && editingTx.place ? esc(editingTx.place) : ""}"></div>
      ${editingTx && editingTx.paid ? `
      <div class="field"><label>สถานะการจ่าย</label>
        <label class="paidtoggle">
          <input type="checkbox" id="tPaid" checked>
          <span>จ่ายแล้ว<small>เอาเครื่องหมายถูกออกแล้วกดบันทึก เพื่อยกเลิกการจ่าย</small></span>
        </label>
      </div>` : ""}
      <div class="btnrow">
        <button type="button" class="btn btn-soft" onclick="closeModal()">ยกเลิก</button>
        <button type="submit" class="btn btn-primary">${editingTx ? "บันทึก" : "จดรายการ"}</button>
      </div>
    </form>`;
  $("modalBg").classList.add("open");
  $("txForm").onsubmit = saveTx;
};
window.pickCat = (k) => {
  pickedCat = k;
  document.querySelectorAll("#catPick .cp").forEach((b, i) => b.classList.toggle("sel", CATS[i].k === k));
};

async function saveTx(e) {
  e.preventDefault();
  const amount = Number($("tAmount").value);
  if (!amount || amount <= 0) return alert("กรุณาใส่ราคาให้ถูกต้อง");
  const payload = {
    tx_date: $("tDate").value,
    name: $("tName").value.trim(),
    amount,
    place: $("tPlace").value.trim() || null,
    category: pickedCat,
  };
  if (editingTx && $("tPaid")) payload.paid = $("tPaid").checked; // หน้าแก้ไขใช้ "ยกเลิกการจ่าย" ได้อย่างเดียว — การจ่ายต้องผ่านปุ่มจ่ายบิลเท่านั้น
  const q = editingTx
    ? sb.from("transactions").update(payload).eq("id", editingTx.id)
    : sb.from("transactions").insert({ ...payload, card_id: view.cardId });
  const { error } = await q;
  if (error) return alert("บันทึกไม่สำเร็จ: " + error.message);
  closeModal(); await loadData(); render();
}

/* ---------- actions ---------- */
window.openCard = (id) => { view = { name: "detail", cardId: id }; expandedTx = null; detYear = detMonth = detStatus = "all"; render(); };
window.backHome = () => { view = { name: "cards", cardId: null }; expandedTx = null; render(); };
window.logout = async () => { await sb.auth.signOut(); };

window.togglePaid = (id, paid) => {
  // เครื่องหมายถูกในแถวเป็นตัวแสดงสถานะเท่านั้น — จ่ายได้ทางเดียวคือปุ่ม "จ่ายบิล" → เลือกรายการ → บันทึกการจ่าย
  if (paid) alert('การจ่ายทำได้ทางเดียว: กดปุ่ม "💳 จ่ายบิล" → เลือกรายการ → กด "บันทึกการจ่าย"');
  else alert('หากต้องการยกเลิกการจ่าย ให้กดที่รายการ → "✏️ แก้ไข" → เอาเครื่องหมายถูกออก → บันทึก');
};

window.toggleExpand = (id) => { expandedTx = expandedTx === id ? null : id; render(); };
window.toggleSort = () => { sortDesc = !sortDesc; render(); };

/* ---------- pay bill: select items then confirm ---------- */
window.openPayModal = (cardId) => {
  const list = txs.filter((t) => t.card_id === cardId && !t.paid);
  if (!list.length) return;
  paySel = new Set(list.map((t) => t.id)); // เริ่มต้นเลือกทุกรายการ
  $("modalBody").innerHTML = `
    <h3>💳 เลือกรายการที่จะจ่าย</h3>
    <div class="paylist">
      ${list.map((t) => `
      <div class="payrow sel" id="pay-${t.id}" onclick="togglePaySel('${t.id}')">
        <div class="chk">✓</div>
        <div class="pn">${esc(t.name)}<small>${thDate(t.tx_date)}${t.place ? " · " + esc(t.place) : ""}</small></div>
        <div class="pa">฿${money(t.amount)}</div>
      </div>`).join("")}
    </div>
    <div class="paytotal" id="payTotal"></div>
    <div class="btnrow">
      <button type="button" class="btn btn-soft" onclick="closeModal()">ยกเลิก</button>
      <button type="button" class="btn btn-green" id="payConfirmBtn" onclick="confirmPay()"></button>
    </div>`;
  $("modalBg").classList.add("open");
  updPayUI();
};
function updPayUI() {
  const total = txs.filter((t) => paySel.has(t.id)).reduce((s, t) => s + Number(t.amount), 0);
  $("payTotal").textContent = `เลือก ${paySel.size} รายการ · รวม ฿${money(total)}`;
  const btn = $("payConfirmBtn");
  btn.textContent = paySel.size ? `✓ บันทึกการจ่าย ฿${money(total)}` : "ยังไม่ได้เลือกรายการ";
  btn.disabled = paySel.size === 0;
}
window.togglePaySel = (id) => {
  if (paySel.has(id)) paySel.delete(id); else paySel.add(id);
  const el = document.getElementById("pay-" + id);
  el.classList.toggle("sel", paySel.has(id));
  el.querySelector(".chk").textContent = paySel.has(id) ? "✓" : "";
  updPayUI();
};
window.confirmPay = async () => {
  if (!paySel.size) return;
  const btn = $("payConfirmBtn"); btn.disabled = true;
  const { error } = await sb.from("transactions").update({ paid: true }).in("id", [...paySel]);
  if (error) { btn.disabled = false; return alert("อัปเดตไม่สำเร็จ: " + error.message); }
  closeModal(); await loadData(); render();
};

window.delTx = async (id) => {
  if (!confirm("ลบรายการนี้?")) return;
  const { error } = await sb.from("transactions").delete().eq("id", id);
  if (error) return alert("ลบไม่สำเร็จ: " + error.message);
  await loadData(); render();
};

window.delCard = async (id) => {
  const card = cards.find((c) => c.id === id);
  const cnt = txs.filter((t) => t.card_id === id).length;
  if (!confirm(`ลบบัตร "${card.name}" และรายการทั้งหมด ${cnt} รายการ? ข้อมูลจะหายถาวร`)) return;
  const { error } = await sb.from("cards").delete().eq("id", id);
  if (error) return alert("ลบไม่สำเร็จ: " + error.message);
  view = { name: "cards", cardId: null };
  await loadData(); render();
};

window.exportCSV = (cardId) => {
  const list = cardId ? txs.filter((t) => t.card_id === cardId) : txs;
  const cardName = (id) => (cards.find((c) => c.id === id) || {}).name || "";
  const rows = [["บัตร", "วันที่", "รายการ", "หมวดหมู่", "ราคา", "สถานที่", "สถานะ"]]
    .concat(list.map((t) => [cardName(t.card_id), t.tx_date, t.name, catOf(t.category).label, t.amount, t.place || "", t.paid ? "จ่ายแล้ว" : "ยังไม่จ่าย"]));
  const csv = "\uFEFF" + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `credit-card-${ymd(new Date())}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};
window.closeModal = closeModal;

/* ---------- PWA: install as app ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
(function installUI() {
  const banner = $("installBanner"), btn = $("installBtn"), hint = $("installHint");
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const dismissed = localStorage.getItem("installDismissed") === "1";
  let deferredPrompt = null;

  const hide = () => banner.classList.remove("show");
  $("installClose").onclick = () => { hide(); localStorage.setItem("installDismissed", "1"); };

  if (isStandalone || dismissed) return;

  if (isIOS) {
    // iOS/iPadOS: Safari ไม่มี install prompt — แนะนำวิธีเพิ่มลงหน้าจอโฮมแทน
    btn.style.display = "none";
    hint.innerHTML = 'กดปุ่มแชร์ <span class="ic">&#x2B06;&#xFE0F;</span> ด้านล่างของ Safari แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b>';
    setTimeout(() => banner.classList.add("show"), 2500);
    return;
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.add("show");
  });
  btn.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    hide();
  };
  window.addEventListener("appinstalled", hide);
})();

/* ---------- boot ---------- */
(async function boot() {
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) { render(); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) await loadData();
  render();
  sb.auth.onAuthStateChange(async (_ev, s) => {
    const wasIn = !!session;
    session = s;
    if (s && !wasIn) { await loadData(); view = { name: "cards", cardId: null }; render(); }
    if (!s && wasIn) { cards = []; txs = []; view = { name: "cards", cardId: null }; render(); }
  });
})();
</script>
</body>
</html>
